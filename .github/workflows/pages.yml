name: Publicar el jardín en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Comprobar JavaScript
        run: |
          node --check app.js
          node --check game.js
          node --check game-core.js
          node --check gardening.js
          node --check gardening-core.js
          node --check world-layout.js
          node --check world-art.js
          node --check world-map.js
          node --check game-menus.js
          node --check calm-postcards.js
          node --check continuity-core.js
          node --check garden-art.js
          node --check garden-life.js
          node --check calm-games.js
          node --check calm-games-core.js
          node --check journal.js
          node --check journal-core.js
          node --check river-scene.js
          node --check phase-two.js
          node --check phase-two-core.js
          node --check phase-two-art.js
          node --check daily-core.js
          node --check extras.js
          node --check motion.js
          node --check illustration.js
          node --check audio.js
          node --check soundscape.js
          node --check pwa.js
          node --check sw.js
      - name: Probar caché sin conexión y aislamiento entre proyectos
        run: node --test tests/*.test.mjs
      - name: Preparar y verificar archivos públicos
        run: node scripts/build.mjs
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Subir sitio
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
