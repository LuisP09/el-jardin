name: Publicar el jardín en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Comprobar JavaScript
        run: |
          node --check app.js
          node --check pwa.js
          node --check sw.js
      - name: Probar caché sin conexión y aislamiento entre proyectos
        run: node --test tests/pwa.test.mjs
      - name: Preparar y verificar archivos públicos
        run: node scripts/build.mjs
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Subir sitio
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
